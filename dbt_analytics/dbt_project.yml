name: 'dbt_analytics'
version: '1.0.0'
config-version: 2

profile: 'dbt_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Resolved from repo root when DBT_RAW_PATH is set (CI and recommended local runs).
  raw_path: "{{ env_var('DBT_RAW_PATH', 'storage/raw') }}"
  # Derived from docs/market_registry.yml (ingest_active: true).
  # DO NOT edit by hand -- run scripts/sync_dbt_vars.py after updating the registry.
  # scripts/check_registry_var_sync.py (CI) enforces sorted-set equality with the registry.
  active_market_codes:
    - au_asx200
    - ch_smi
    - de_dax
    - es_ibex35
    - fr_cac40
    - jp_nikkei225
    - nl_aex
    - uk_ftse100
    - us_sp500

models:
  dbt_analytics:
    1_staging:
      +materialized: view
      +schema: staging
      +tags: [staging]

    2_base:
      +materialized: view
      +schema: base
      +tags: [base]

    3_core:
      +materialized: table
      +schema: core
      +tags: [core]

    4_intermediate:
      +materialized: table
      +schema: intermediate
      +tags: [intermediate]

    5_marts:
      +materialized: table
      +schema: marts
      +tags: [marts]
