version: 2

seeds:
  - name: company_name_overrides
    description: >
      Manual corrections for a constituent's `company_name`, applied in
      base_yf__constituents so a wrong or legal-register seed name never reaches a card
      headline uncorrected. One row per (market_code, ticker) needing a fix; a ticker not
      listed here is untouched. Does not edit storage/seeds/*/constituents.csv, by design
      (2026-08-28 owner decision: corrections live in the model, not the raw seed).
    config:
      column_types:
        market_code: varchar
        ticker: varchar
        company_name: varchar
        reason: varchar
    columns:
      - name: market_code
        description: "Registry partition key, matching the constituent row this corrects."
        data_tests:
          - not_null
      - name: ticker
        description: "Provider symbol as stored in the seed, matching the row this corrects."
        data_tests:
          - not_null
      - name: company_name
        description: "The corrected display name; wins over the seed's own company_name."
        data_tests:
          - not_null
      - name: reason
        description: "Why the override exists, for the next person reading this file."
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker

  - name: metric_catalogue
    description: >
      Single source of truth for every card metric — one row per (metric_id, entity). Captures the
      formula as a spec (base_relation + numerator_expr / denominator_expr over the base's real
      columns), the analytical definition (calculation / interpretation / applicability), the display
      format, the display taxonomy (perspective, importance_tier, display_order, direction), the
      benchmarkable flag and basis column, and the plain-language copy (gloss / analogy / learn).
      int_stock__card_metrics computes each metric once; this seed
      defines and documents it. The frontend reads frontend/metrics.json, generated from this seed by
      scripts/export_metric_definitions_json.py. Integrity is guarded by tests/test_metric_catalogue.py
      (catalogue metrics are computed in the model; the regenerated JSON matches the committed file).
    config:
      column_types:
        importance_tier: integer
        display_order: integer
    columns:
      - name: metric_id
        description: "Stable metric id; equals the metric column name in int_stock__card_metrics."
        tests:
          - not_null
          - unique
      - name: entity
        description: "The entity the metric describes (one entity in this project)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["company"]
      - name: label
        description: "Card-face label."
        tests: [not_null]
      - name: description
        description: "Plain-English definition: what the metric measures and its source."
        tests: [not_null]
      - name: calculation
        description: "How the metric is computed, in plain language — the analytical definition."
        tests: [not_null]
      - name: interpretation
        description: "What a higher or lower value means for the company; beginner-facing reasoning."
        tests: [not_null]
      - name: applicability
        description: "When the metric breaks or misleads (financials, pre-revenue, loss-makers, near-zero denominators)."
        tests: [not_null]
      - name: base_relation
        description: "The model the numerator/denominator spec resolves against."
        tests:
          - accepted_values:
              arguments:
                values: ["fct_fundamentals_snapshot"]
      - name: format
        description: "Display format token consumed by the frontend formatter."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ratio_1", "ratio_2", "percent_1", "currency_compact"]
      - name: perspective
        description: "Analytical lens. Full taxonomy: valuation, profitability, growth, solvency, liquidity, cash, returns (this PR populates five)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["valuation", "profitability", "growth", "solvency", "liquidity", "cash", "returns"]
      - name: importance_tier
        description: "Relative importance ranking (1 = higher priority, 2 = lower) -- not tied to a visual split on the card face; every applicable metric renders the same way, lens-grouped."
        tests:
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false
      - name: direction
        description: "Performance semantic: higher_better, lower_better, or neutral."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["higher_better", "lower_better", "neutral"]
      - name: applies_to
        description: >
          Pipe-delimited company types that render this metric (e.g. operating|financial|pre_revenue).
          Drives the frontend per-type card. Value membership is validated in
          tests/tooling/test_metric_catalogue.py (accepted_values cannot check a compound pipe-delimited cell).
        tests: [not_null]
