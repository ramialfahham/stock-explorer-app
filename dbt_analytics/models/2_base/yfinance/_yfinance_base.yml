version: 2

models:
  - name: base_yf__constituents
    description: >
      **Source:** stg_yf__constituents across all active markets (union via macro).
      **Grain:** One row per (market_code, ticker) after deduplication.
      **What:** Latest ingest row per ticker; keys for dim_stock and ingest lineage.
    meta:
      owner: data
      domain: stock_cards
      criticality: medium
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
    columns:
      - name: market_code
        description: >
          Registry partition key; unique with ticker at this grain.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol after cross-market union and dedup.
        data_tests:
          - not_null
      - name: company_name
        description: >
          Company name from the winning constituent row by latest ingested_at.
      - name: refreshed_at
        description: >
          Seed refresh timestamp from the winning row.
      - name: source
        description: >
          Constituent provenance from the winning row.
      - name: ingested_at
        description: >
          Ingest timestamp used to break ties when multiple rows exist per ticker.

  - name: base_yf__fundamentals
    description: >
      **Source:** stg_yf__fundamentals across all active markets.
      **Grain:** One row per (market_code, ticker, snapshot_date) after deduplication.
      **What:** Deduplicated fundamentals snapshots before latest-per-ticker in core.
    meta:
      owner: data
      domain: stock_cards
      criticality: medium
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
              - snapshot_date
    columns:
      - name: market_code
        description: >
          Registry partition key.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol.
        data_tests:
          - not_null
      - name: snapshot_date
        description: >
          Fundamentals as-of date for this snapshot row.
        data_tests:
          - not_null
      - name: info_forward_pe
        description: >
          Deduped raw forwardPE passed through to fct_fundamentals_snapshot.
      - name: info_operating_margins
        description: >
          Deduped raw operatingMargins decimal; audit reference only after TTM cutover.
      - name: qtr_operating_income_0
        description: >
          Deduped Operating Income, most recent quarter (index 0); TTM numerator.
      - name: qtr_operating_income_1
        description: >
          Deduped Operating Income, one quarter back (index 1); TTM numerator.
      - name: qtr_operating_income_2
        description: >
          Deduped Operating Income, two quarters back (index 2); TTM numerator.
      - name: qtr_operating_income_3
        description: >
          Deduped Operating Income, three quarters back (index 3); TTM numerator.
      - name: qtr_total_revenue_0
        description: >
          Deduped Total Revenue, most recent quarter (index 0); TTM denominator.
      - name: qtr_total_revenue_1
        description: >
          Deduped Total Revenue, one quarter back (index 1); TTM denominator.
      - name: qtr_total_revenue_2
        description: >
          Deduped Total Revenue, two quarters back (index 2); TTM denominator.
      - name: qtr_total_revenue_3
        description: >
          Deduped Total Revenue, three quarters back (index 3); TTM denominator.
      - name: qtr_operating_revenue_0
        description: >
          Deduped Operating Revenue Q0; bank fallback when Operating Income is absent.
      - name: qtr_operating_revenue_1
        description: >
          Deduped Operating Revenue one quarter back (index 1); bank TTM fallback.
      - name: qtr_operating_revenue_2
        description: >
          Deduped Operating Revenue two quarters back (index 2); bank TTM fallback.
      - name: qtr_operating_revenue_3
        description: >
          Deduped Operating Revenue three quarters back (index 3); bank TTM fallback.
      - name: qtr_operating_expense_0
        description: >
          Deduped Operating Expense Q0; paired with Operating Revenue for derived op profit.
      - name: qtr_operating_expense_1
        description: >
          Deduped Operating Expense one quarter back (index 1); bank TTM fallback.
      - name: qtr_operating_expense_2
        description: >
          Deduped Operating Expense two quarters back (index 2); bank TTM fallback.
      - name: qtr_operating_expense_3
        description: >
          Deduped Operating Expense three quarters back (index 3); bank TTM fallback.
      - name: stmt_operating_income
        description: >
          Deduped latest annual operating profit (fallback row labels).
      - name: stmt_operating_revenue
        description: >
          Deduped latest annual Operating Revenue when operating profit row is absent.
      - name: stmt_operating_expense
        description: >
          Deduped latest annual Operating Expense when operating profit row is absent.
      - name: info_revenue_growth
        description: >
          Deduped raw revenueGrowth decimal.
      - name: info_net_debt
        description: >
          Deduped raw netDebt.
      - name: info_total_debt
        description: >
          Deduped raw totalDebt.
      - name: info_total_cash
        description: >
          Deduped raw totalCash.
      - name: info_ebitda
        description: >
          Deduped raw ebitda.
      - name: info_return_on_equity
        description: >
          Deduped raw returnOnEquity decimal.
      - name: info_current_ratio
        description: >
          Deduped raw currentRatio.
      - name: info_price_to_book
        description: >
          Deduped raw priceToBook.
      - name: info_price_to_sales
        description: >
          Deduped raw priceToSalesTrailing12Months.
      - name: info_ev_to_ebitda
        description: >
          Deduped raw enterpriseToEbitda.
      - name: info_free_cashflow
        description: >
          Deduped raw freeCashflow (trailing).
      - name: info_market_cap
        description: >
          Deduped raw marketCap (current).
      - name: info_sector
        description: >
          Deduped raw sector label.
      - name: info_currency
        description: >
          Deduped raw currency code.
      - name: info_long_name
        description: >
          Deduped raw longName.
      - name: info_business_summary
        description: >
          Deduped raw longBusinessSummary company description.
      - name: info_founded_year
        description: >
          Deduped raw Yahoo founded year when available.
      - name: stmt_total_revenue
        description: >
          Deduped latest-annual Total Revenue.
      - name: stmt_free_cash_flow
        description: >
          Deduped latest-annual Free Cash Flow.
      - name: stmt_fiscal_period_end
        description: >
          Deduped fiscal period end for statement columns.
      - name: stmt_currency
        description: >
          Deduped statement currency when present.
      - name: stmt_stockholders_equity
        description: >
          Deduped latest-annual shareholders' equity from the balance sheet.
      - name: stmt_total_debt
        description: >
          Deduped latest-annual total debt from the balance sheet.
      - name: stmt_current_assets
        description: >
          Deduped latest-annual current assets; null for financials (no current split).
      - name: stmt_current_liabilities
        description: >
          Deduped latest-annual current liabilities; null for financials (no current split).
      - name: stmt_cash_and_equivalents
        description: >
          Deduped latest-annual cash and equivalents from the balance sheet.
      - name: stmt_tangible_book_value
        description: >
          Deduped latest-annual tangible book value from the balance sheet.
      - name: stmt_operating_cash_flow
        description: >
          Deduped latest-annual operating cash flow.
      - name: stmt_capital_expenditure
        description: >
          Deduped latest-annual capital expenditure (negative = outflow).
      - name: stmt_interest_expense
        description: >
          Deduped latest-annual interest expense (positive magnitude).
      - name: stmt_net_income
        description: >
          Deduped latest-annual net income.
      - name: info_dividend_yield
        description: >
          Deduped raw dividendYield (decimal).
      - name: info_payout_ratio
        description: >
          Deduped raw payoutRatio (decimal).
