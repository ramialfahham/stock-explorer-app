version: 2

models:
  - name: mart_stock_cards
    description: >
      **What:** Supabase export dataset for Streamlit stock swipe cards (card-eligible rows only).
      **Grain:** One row per (market_code, ticker, snapshot_date) where is_card_eligible.
      **Source:** int_stock__card_metrics left join int_stock__sector_benchmarks.
      **Used by:** export_to_supabase.py, Streamlit app.
    meta:
      owner: data
      domain: stock_cards
      criticality: high
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
              - snapshot_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              is_card_eligible = (
                forward_pe is not null
                and ebit_margin_pct is not null
                and revenue_growth_yoy_pct is not null
                and net_debt_to_ebitda is not null
                and fcf_margin_pct is not null
              )
      - dbt_utils.expression_is_true:
          name: mart_stock_cards_all_rows_eligible
          arguments:
            expression: is_card_eligible = true
    columns:
      - name: market_code
        description: >
          Registry partition key; Supabase FK to markets table.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol exported to Supabase.
        data_tests:
          - not_null
      - name: company_name
        description: >
          Company display name on the swipe card.
      - name: sector
        description: >
          Sector label for UI and benchmark join.
      - name: currency
        description: >
          Currency code for formatted metric display.
      - name: business_summary
        description: >
          Yahoo longBusinessSummary text for company context on the card; nullable.
      - name: forward_pe
        description: >
          Card metric 1 — forward P/E (multiple). See data_contract § card metrics.
      - name: ebit_margin_pct
        description: >
          Card metric 2 — operating margin percent (0–100 scale).
      - name: ebit_margin_basis
        description: >
          Period basis for ebit_margin_pct — ttm_quarterly or annual_latest.
      - name: revenue_growth_yoy_pct
        description: >
          Card metric 3 — revenue growth YoY percent (0–100 scale).
      - name: net_debt_to_ebitda
        description: >
          Card metric 4 — net debt to EBITDA ratio.
      - name: fcf_margin_pct
        description: >
          Card metric 5 — free cash flow margin percent (0–100 scale).
      - name: is_card_eligible
        description: >
          Whether all five metrics are present; drives discovery queue inclusion.
        data_tests:
          - not_null
      - name: sector_peer_count
        description: >
          Eligible peer count in sector; null when sector unknown or no benchmark row.
      - name: sector_median_forward_pe
        description: >
          Sector median benchmark for forward P/E; null if peer count < 8.
      - name: sector_median_ebit_margin_pct
        description: >
          Sector median benchmark for EBIT margin; null if peer count < 8.
      - name: sector_median_revenue_growth_yoy_pct
        description: >
          Sector median benchmark for revenue growth; null if peer count < 8.
      - name: sector_median_net_debt_to_ebitda
        description: >
          Sector median benchmark for leverage; null if peer count < 8.
      - name: sector_median_fcf_margin_pct
        description: >
          Sector median benchmark for FCF margin; null if peer count < 8.
      - name: snapshot_date
        description: >
          Fundamentals as-of date exported with the card row.
        data_tests:
          - not_null

  - name: mart_stock_eligibility_gaps
    description: >
      **What:** QA mart of tickers failing the five-metric eligibility gate.
      **Grain:** One row per (market_code, ticker, snapshot_date) where NOT is_card_eligible.
      **Source:** int_stock__card_metrics.
      **Used by:** check_eligibility_gaps.py (ops/CI). Not exported to Supabase.
    meta:
      owner: data
      domain: stock_cards
      criticality: medium
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
              - snapshot_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: is_card_eligible = false
      - dbt_utils.expression_is_true:
          name: eligibility_gaps_missing_metrics_non_empty
          arguments:
            expression: len(missing_metrics) > 0
    columns:
      - name: market_code
        description: >
          Registry partition key for the ineligible ticker row.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol failing the eligibility gate.
        data_tests:
          - not_null
      - name: snapshot_date
        description: >
          Fundamentals as-of date for the gap row.
        data_tests:
          - not_null
      - name: company_name
        description: >
          Company display name for ops debugging.
      - name: sector
        description: >
          Sector label for grouping gap patterns.
      - name: missing_metrics
        description: >
          List of null card metric column names blocking eligibility.
      - name: is_card_eligible
        description: >
          Always false on this mart.
