version: 2

sources:
  - name: yfinance
    description: >
      Raw yfinance parquet landed by Python ingestion under storage/raw/{market_code}/.
      Loaded weekly via data_pipeline.yml; no derived metrics in ingestion.
    loader: python
    meta:
      owner: data
      domain: stock_cards
      criticality: medium
    tables:
      - name: yf_constituents
        description: >
          Constituent snapshot per market at ingest time; one row per ticker from seeds.
        columns:
          - name: market_code
            description: Registry partition key.
          - name: ticker
            description: Provider symbol string.
          - name: company_name
            description: Display name from seed at ingest.
          - name: refreshed_at
            description: Seed last-refresh timestamp.
          - name: source
            description: Constituent list provenance.
          - name: ingested_at
            description: When parquet row was written.

      - name: yf_daily_prices
        description: >
          OHLCV price history per ticker and trade date from yfinance download.
        columns:
          - name: market_code
            description: Registry partition key.
          - name: ticker
            description: Provider symbol.
          - name: trading_date
            description: Trade date for the bar.
          - name: open
            description: Open price.
          - name: high
            description: High price.
          - name: low
            description: Low price.
          - name: close
            description: Close price.
          - name: volume
            description: Share volume.
          - name: dividends
            description: Dividend component on the bar.
          - name: stock_splits
            description: Split factor on the bar.

      - name: yf_fundamentals
        description: >
          Raw ticker.info and latest-annual statement fields per ticker snapshot.
        columns:
          - name: market_code
            description: Registry partition key.
          - name: ticker
            description: Provider symbol.
          - name: snapshot_date
            description: Fundamentals pull as-of date.
          - name: info_forward_pe
            description: Raw Yahoo forwardPE.
          - name: info_operating_margins
            description: Raw Yahoo operatingMargins (decimal).
          - name: info_revenue_growth
            description: Raw Yahoo revenueGrowth (decimal).
          - name: info_net_debt
            description: Raw Yahoo netDebt.
          - name: info_total_debt
            description: Raw Yahoo totalDebt; used with totalCash when netDebt is null.
          - name: info_total_cash
            description: Raw Yahoo totalCash; used with totalDebt when netDebt is null.
          - name: info_ebitda
            description: Raw Yahoo ebitda.
          - name: info_sector
            description: Raw Yahoo sector.
          - name: info_currency
            description: Raw Yahoo currency.
          - name: info_long_name
            description: Raw Yahoo longName.
          - name: info_business_summary
            description: Raw Yahoo longBusinessSummary company description.
          - name: info_founded_year
            description: Raw Yahoo founded year when provided; often null.
          - name: stmt_total_revenue
            description: Latest annual Total Revenue from statements.
          - name: stmt_free_cash_flow
            description: Latest annual Free Cash Flow from statements.
          - name: stmt_fiscal_period_end
            description: Fiscal period end for statement column.
          - name: stmt_currency
            description: Statement currency when available.
          - name: qtr_operating_income_0
            description: Most recent quarter Operating Income (raw).
          - name: qtr_operating_income_1
            description: Prior quarter Operating Income (raw).
          - name: qtr_operating_income_2
            description: Third quarter back Operating Income (raw).
          - name: qtr_operating_income_3
            description: Fourth quarter back Operating Income (raw).
          - name: qtr_total_revenue_0
            description: Most recent quarter Total Revenue (raw).
          - name: qtr_total_revenue_1
            description: Prior quarter Total Revenue (raw).
          - name: qtr_total_revenue_2
            description: Third quarter back Total Revenue (raw).
          - name: qtr_total_revenue_3
            description: Fourth quarter back Total Revenue (raw).
          - name: qtr_operating_revenue_0
            description: Most recent quarter Operating Revenue (raw bank fallback).
          - name: qtr_operating_revenue_1
            description: Prior quarter Operating Revenue (raw bank fallback).
          - name: qtr_operating_revenue_2
            description: Third quarter back Operating Revenue (raw bank fallback).
          - name: qtr_operating_revenue_3
            description: Fourth quarter back Operating Revenue (raw bank fallback).
          - name: qtr_operating_expense_0
            description: Most recent quarter Operating Expense (raw bank fallback).
          - name: qtr_operating_expense_1
            description: Prior quarter Operating Expense (raw bank fallback).
          - name: qtr_operating_expense_2
            description: Third quarter back Operating Expense (raw bank fallback).
          - name: qtr_operating_expense_3
            description: Fourth quarter back Operating Expense (raw bank fallback).
          - name: stmt_operating_income
            description: Latest annual operating profit row (raw, label fallbacks).
          - name: stmt_operating_revenue
            description: Latest annual Operating Revenue (raw bank fallback).
          - name: stmt_operating_expense
            description: Latest annual Operating Expense (raw bank fallback).
          - name: stmt_stockholders_equity
            description: Latest annual common shareholders' equity (balance sheet).
          - name: stmt_total_debt
            description: Latest annual total debt (balance sheet).
          - name: stmt_current_assets
            description: Latest annual current assets (balance sheet); null for financials.
          - name: stmt_current_liabilities
            description: Latest annual current liabilities (balance sheet); null for financials.
          - name: stmt_cash_and_equivalents
            description: Latest annual cash and equivalents (balance sheet).
          - name: stmt_tangible_book_value
            description: Latest annual tangible book value (balance sheet).
