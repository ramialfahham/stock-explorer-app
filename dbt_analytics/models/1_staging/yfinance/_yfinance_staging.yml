version: 2

models:
  - name: stg_yf__constituents
    description: >
      **Source:** `yf_constituents.parquet` per market under `storage/raw/{market_code}/`.
      **Grain:** One row per (market_code, ticker).
      **What:** Typed constituent list joined from seeds at ingest; no business metrics.
    meta:
      owner: data
      domain: stock_cards
      criticality: low
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
    columns:
      - name: market_code
        description: >
          Registry partition key for the index universe (e.g. us_sp500). FK to markets.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol as stored in seeds and parquet (string; may include suffixes).
        data_tests:
          - not_null
      - name: company_name
        description: >
          Display name from constituent seed or ingest join; may be overridden in core.
      - name: refreshed_at
        description: >
          ISO timestamp when the seed row was last refreshed by refresh_constituents.
      - name: source
        description: >
          Constituent provenance label (e.g. wikipedia, manual_import, ci_fixture).
      - name: ingested_at
        description: >
          ISO timestamp when this row was written to raw parquet during ingestion.

  - name: stg_yf__daily_prices
    description: >
      **Source:** `yf_daily_prices.parquet` per market under `storage/raw/{market_code}/`.
      **Grain:** One row per (market_code, ticker, trading_date).
      **What:** Typed OHLCV history from yfinance download; not shown on discovery cards.
    meta:
      owner: data
      domain: stock_cards
      criticality: low
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
              - trading_date
    columns:
      - name: market_code
        description: >
          Registry partition key for the index universe.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol for the price series.
        data_tests:
          - not_null
      - name: trading_date
        description: >
          Exchange calendar date for the OHLCV bar.
        data_tests:
          - not_null
      - name: open
        description: >
          Session open price in local currency units.
      - name: high
        description: >
          Session high price in local currency units.
      - name: low
        description: >
          Session low price in local currency units.
      - name: close
        description: >
          Session close or adjusted close from yfinance.
      - name: volume
        description: >
          Traded share volume for the session.
      - name: dividends
        description: >
          Dividend amount attributed to the bar by yfinance (often 0).
      - name: stock_splits
        description: >
          Split factor attributed to the bar by yfinance (often 0).

  - name: stg_yf__fundamentals
    description: >
      **Source:** `yf_fundamentals.parquet` per market under `storage/raw/{market_code}/`.
      **Grain:** One row per (market_code, ticker, snapshot_date).
      **What:** Typed raw ticker.info and statement fields; ratios computed downstream only.
    meta:
      owner: data
      domain: stock_cards
      criticality: medium
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
              - snapshot_date
    columns:
      - name: market_code
        description: >
          Registry partition key for the index universe.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol for the fundamentals snapshot.
        data_tests:
          - not_null
      - name: snapshot_date
        description: >
          As-of date when ingestion captured this fundamentals pull.
        data_tests:
          - not_null
      - name: info_forward_pe
        description: >
          Raw Yahoo forwardPE from ticker.info; feeds card metric forward_pe.
      - name: info_operating_margins
        description: >
          Raw Yahoo operatingMargins decimal (e.g. 0.12 = 12%); audit reference only after TTM cutover.
      - name: qtr_operating_income_0
        description: >
          Operating Income from the most recent quarterly income statement (index 0); TTM numerator.
      - name: qtr_operating_income_1
        description: >
          Operating Income one quarter back (index 1); TTM numerator.
      - name: qtr_operating_income_2
        description: >
          Operating Income two quarters back (index 2); TTM numerator.
      - name: qtr_operating_income_3
        description: >
          Operating Income three quarters back (index 3); TTM numerator.
      - name: qtr_total_revenue_0
        description: >
          Total Revenue from the most recent quarter (index 0); TTM denominator.
      - name: qtr_total_revenue_1
        description: >
          Total Revenue one quarter back (index 1); TTM denominator.
      - name: qtr_total_revenue_2
        description: >
          Total Revenue two quarters back (index 2); TTM denominator.
      - name: qtr_total_revenue_3
        description: >
          Total Revenue three quarters back (index 3); TTM denominator.
      - name: qtr_operating_revenue_0
        description: >
          Operating Revenue Q0 for bank-style statements when Operating Income is absent.
      - name: qtr_operating_revenue_1
        description: >
          Operating Revenue one quarter back (index 1); bank fallback for TTM op profit.
      - name: qtr_operating_revenue_2
        description: >
          Operating Revenue two quarters back (index 2); bank fallback for TTM op profit.
      - name: qtr_operating_revenue_3
        description: >
          Operating Revenue three quarters back (index 3); bank fallback for TTM op profit.
      - name: qtr_operating_expense_0
        description: >
          Operating Expense Q0 paired with Operating Revenue for dbt-derived op profit.
      - name: qtr_operating_expense_1
        description: >
          Operating Expense one quarter back (index 1); bank fallback for TTM op profit.
      - name: qtr_operating_expense_2
        description: >
          Operating Expense two quarters back (index 2); bank fallback for TTM op profit.
      - name: qtr_operating_expense_3
        description: >
          Operating Expense three quarters back (index 3); bank fallback for TTM op profit.
      - name: stmt_operating_income
        description: >
          Latest annual operating profit (fallback Yahoo row labels).
      - name: stmt_operating_revenue
        description: >
          Latest annual Operating Revenue when operating profit row is absent.
      - name: stmt_operating_expense
        description: >
          Latest annual Operating Expense when operating profit row is absent.
      - name: info_revenue_growth
        description: >
          Raw Yahoo revenueGrowth decimal; feeds revenue_growth_yoy_pct.
      - name: info_net_debt
        description: >
          Raw Yahoo netDebt from ticker.info; primary numerator for net_debt_to_ebitda.
      - name: info_total_debt
        description: >
          Raw Yahoo totalDebt; with info_total_cash when netDebt is null (dbt coalesce).
      - name: info_total_cash
        description: >
          Raw Yahoo totalCash; with info_total_debt when netDebt is null (dbt coalesce).
      - name: info_ebitda
        description: >
          Raw Yahoo ebitda from ticker.info; denominator for net_debt_to_ebitda.
      - name: info_return_on_equity
        description: >
          Raw Yahoo returnOnEquity decimal (e.g. 0.18 = 18%); feeds computed roe_pct (data-only).
      - name: info_current_ratio
        description: >
          Raw Yahoo currentRatio; feeds computed current_ratio (data-only).
      - name: info_price_to_book
        description: >
          Raw Yahoo priceToBook; feeds computed price_to_book (data-only).
      - name: info_price_to_sales
        description: >
          Raw Yahoo priceToSalesTrailing12Months; feeds computed price_to_sales (data-only).
      - name: info_ev_to_ebitda
        description: >
          Raw Yahoo enterpriseToEbitda; feeds computed ev_to_ebitda (data-only).
      - name: info_free_cashflow
        description: >
          Raw Yahoo freeCashflow (trailing); fcf_yield_pct numerator (data-only).
      - name: info_market_cap
        description: >
          Raw Yahoo marketCap (current); fcf_yield_pct denominator (data-only).
      - name: info_sector
        description: >
          Raw Yahoo sector label for grouping and sector benchmarks.
      - name: info_currency
        description: >
          Raw Yahoo currency code for display (ISO-style string).
      - name: info_long_name
        description: >
          Raw Yahoo longName; company name fallback in dim_stock.
      - name: info_business_summary
        description: >
          Raw Yahoo longBusinessSummary; company description for card context.
      - name: info_founded_year
        description: >
          Raw Yahoo founded year when available; nullable on most tickers.
      - name: stmt_total_revenue
        description: >
          Total Revenue from latest annual income statement column.
      - name: stmt_free_cash_flow
        description: >
          Free Cash Flow from latest annual cashflow statement column.
      - name: stmt_fiscal_period_end
        description: >
          End date of the fiscal period column used for statement fields.
      - name: stmt_currency
        description: >
          Currency on the financial statement object when provided by Yahoo.
      - name: stmt_stockholders_equity
        description: >
          Shareholders' equity from the latest annual balance sheet (fallback row labels).
      - name: stmt_total_debt
        description: >
          Total debt from the latest annual balance sheet (fallback row labels).
      - name: stmt_current_assets
        description: >
          Current assets from the latest annual balance sheet; null for financials (no current split).
      - name: stmt_current_liabilities
        description: >
          Current liabilities from the latest annual balance sheet; null for financials (no current split).
      - name: stmt_cash_and_equivalents
        description: >
          Cash and equivalents from the latest annual balance sheet (fallback row labels).
      - name: stmt_tangible_book_value
        description: >
          Tangible book value from the latest annual balance sheet; enables price-to-tangible-book.
      - name: stmt_total_assets
        description: >
          Total assets from the latest annual balance sheet; enables ROA (net income / total assets).
      - name: stmt_operating_cash_flow
        description: >
          Operating cash flow from the latest annual cash-flow statement.
      - name: stmt_capital_expenditure
        description: >
          Capital expenditure from the latest annual cash-flow statement (negative = cash outflow).
      - name: stmt_interest_expense
        description: >
          Interest expense from the latest annual income statement (positive magnitude).
      - name: stmt_net_income
        description: >
          Net income from the latest annual income statement.
      - name: stmt_net_income_common
        description: >
          Net income attributable to common shareholders (after minority interest and preferred
          dividends) from the latest annual income statement.
      - name: info_dividend_yield
        description: >
          Raw Yahoo dividendYield (decimal); returns/income lens (data-only).
      - name: info_payout_ratio
        description: >
          Raw Yahoo payoutRatio (decimal); returns/income lens (data-only).
