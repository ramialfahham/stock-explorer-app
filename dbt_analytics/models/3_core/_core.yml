version: 2

models:
  - name: dim_stock
    description: >
      **What:** Canonical stock dimension for discovery (name, sector, currency).
      **Grain:** One row per (market_code, ticker).
      **Source:** base_yf__constituents joined to latest base_yf__fundamentals.
      **Used by:** int_stock__card_metrics, mart_stock_cards.
    meta:
      owner: data
      domain: stock_cards
      criticality: high
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
    columns:
      - name: market_code
        description: >
          Registry partition key for the listed universe.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol; natural key with market_code.
        data_tests:
          - not_null
      - name: company_name
        description: >
          Display name: seed company_name, else latest info_long_name from fundamentals.
      - name: sector
        description: >
          GICS-style sector from latest fundamentals info_sector; used for benchmarks.
      - name: currency
        description: >
          Trading/reporting currency from latest fundamentals info_currency.

  - name: fct_fundamentals_snapshot
    description: >
      **What:** Latest fundamentals fact per ticker — system of record for raw Yahoo fields.
      **Grain:** One row per (market_code, ticker).
      **Source:** base_yf__fundamentals (most recent snapshot_date per ticker).
      **Used by:** int_stock__card_metrics for card metric calculations.
    meta:
      owner: data
      domain: stock_cards
      criticality: high
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
    columns:
      - name: market_code
        description: >
          Registry partition key.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol.
        data_tests:
          - not_null
      - name: snapshot_date
        description: >
          Date of the winning fundamentals snapshot (latest per ticker).
        data_tests:
          - not_null
      - name: info_forward_pe
        description: >
          Yahoo forwardPE on the latest snapshot; direct input to forward_pe.
      - name: info_operating_margins
        description: >
          Yahoo operatingMargins decimal on latest snapshot; audit reference only after TTM cutover.
      - name: qtr_operating_income_0
        description: >
          Operating Income, most recent quarter (index 0); feeds TTM ebit_margin_pct.
      - name: qtr_operating_income_1
        description: >
          Operating Income one quarter back (index 1); feeds TTM ebit_margin_pct.
      - name: qtr_operating_income_2
        description: >
          Operating Income two quarters back (index 2); feeds TTM ebit_margin_pct.
      - name: qtr_operating_income_3
        description: >
          Operating Income three quarters back (index 3); feeds TTM ebit_margin_pct.
      - name: qtr_total_revenue_0
        description: >
          Total Revenue, most recent quarter (index 0); feeds TTM ebit_margin_pct.
      - name: qtr_total_revenue_1
        description: >
          Total Revenue one quarter back (index 1); feeds TTM ebit_margin_pct.
      - name: qtr_total_revenue_2
        description: >
          Total Revenue two quarters back (index 2); feeds TTM ebit_margin_pct.
      - name: qtr_total_revenue_3
        description: >
          Total Revenue three quarters back (index 3); feeds TTM ebit_margin_pct.
      - name: qtr_operating_revenue_0
        description: >
          Operating Revenue Q0 when Operating Income missing (UK banks); dbt derives op profit.
      - name: qtr_operating_revenue_1
        description: >
          Operating Revenue one quarter back (index 1); bank fallback for TTM op profit.
      - name: qtr_operating_revenue_2
        description: >
          Operating Revenue two quarters back (index 2); bank fallback for TTM op profit.
      - name: qtr_operating_revenue_3
        description: >
          Operating Revenue three quarters back (index 3); bank fallback for TTM op profit.
      - name: qtr_operating_expense_0
        description: >
          Operating Expense Q0 when Operating Income missing (UK banks); dbt derives op profit.
      - name: qtr_operating_expense_1
        description: >
          Operating Expense one quarter back (index 1); bank fallback for TTM op profit.
      - name: qtr_operating_expense_2
        description: >
          Operating Expense two quarters back (index 2); bank fallback for TTM op profit.
      - name: qtr_operating_expense_3
        description: >
          Operating Expense three quarters back (index 3); bank fallback for TTM op profit.
      - name: stmt_operating_income
        description: >
          Latest annual operating profit (fallback labels); feeds annual ebit_margin_pct.
      - name: stmt_operating_revenue
        description: >
          Latest annual Operating Revenue when stmt_operating_income missing.
      - name: stmt_operating_expense
        description: >
          Latest annual Operating Expense when stmt_operating_income missing.
      - name: info_revenue_growth
        description: >
          Yahoo revenueGrowth decimal on latest snapshot.
      - name: info_net_debt
        description: >
          Yahoo netDebt on latest snapshot; coalesced with total_debt - total_cash in metrics.
      - name: info_total_debt
        description: >
          Yahoo totalDebt on latest snapshot; fallback net-debt numerator with total_cash.
      - name: info_total_cash
        description: >
          Yahoo totalCash on latest snapshot; fallback net-debt numerator with total_debt.
      - name: info_ebitda
        description: >
          Yahoo ebitda on latest snapshot; null or zero blocks net_debt_to_ebitda.
      - name: info_return_on_equity
        description: >
          Yahoo returnOnEquity decimal on latest snapshot; feeds computed roe_pct (×100, data-only).
      - name: info_sector
        description: >
          Yahoo sector on latest snapshot; coalesced with dim_stock.sector in metrics.
      - name: info_currency
        description: >
          Yahoo currency on latest snapshot.
      - name: info_long_name
        description: >
          Yahoo longName on latest snapshot.
      - name: info_business_summary
        description: >
          Yahoo longBusinessSummary on latest snapshot; exported as business_summary on cards.
      - name: info_founded_year
        description: >
          Yahoo founded year on latest snapshot; exported as company_founded_year on cards.
      - name: stmt_total_revenue
        description: >
          Latest annual Total Revenue for FCF margin denominator.
      - name: stmt_free_cash_flow
        description: >
          Latest annual Free Cash Flow for FCF margin numerator.
      - name: stmt_fiscal_period_end
        description: >
          Fiscal period end date for the statement columns used.
      - name: stmt_currency
        description: >
          Statement currency when returned by Yahoo on the cashflow/income objects.
