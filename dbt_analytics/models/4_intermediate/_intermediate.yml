version: 2

models:
  - name: int_stock__card_metrics
    description: >
      **What:** Swipe-card metrics and per-company-type eligibility per ticker snapshot.
      **Grain:** One row per (market_code, ticker), each at its market's latest snapshot_date
      from fct_fundamentals_snapshot.
      **Source:** fct_fundamentals_snapshot, dim_stock.
      **Used by:** int_stock__sector_benchmarks, mart_stock_cards.
      Eligibility rules: see doc block card_eligibility in _docs.md / data_contract.md.
    meta:
      owner: data
      domain: stock_cards
      criticality: high
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - ticker
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              is_card_eligible = case company_type
                when 'financial' then (
                  statement_roe_pct is not null
                  and net_margin_pct is not null
                )
                when 'pre_revenue' then (
                  net_cash is not null
                )
                else (
                  ebit_margin_pct is not null
                  and revenue_growth_yoy_pct is not null
                  and net_debt_to_ebitda is not null
                  and fcf_margin_pct is not null
                )
              end
      - dbt_utils.expression_is_true:
          name: card_metrics_missing_metrics_consistent_with_eligibility
          arguments:
            expression: >-
              (is_card_eligible and len(missing_metrics) = 0)
              or (not is_card_eligible and len(missing_metrics) > 0)
    columns:
      - name: market_code
        description: >
          Registry partition key.
        data_tests:
          - not_null
      - name: ticker
        description: >
          Provider symbol.
        data_tests:
          - not_null
      - name: snapshot_date
        description: >
          Fundamentals as-of date from the snapshot driving metrics.
        data_tests:
          - not_null
      - name: company_name
        description: >
          Display name from dim_stock for card header. Null when: dim_stock itself has no
          name for this ticker (both the seed name and info_long_name were missing there).
      - name: sector
        description: >
          Sector for peer grouping: coalesce(snapshot info_sector, dim_stock.sector). Null
          when: both sides of the coalesce are missing for this ticker.
      - name: currency
        description: >
          Display currency: coalesce(snapshot info_currency, dim_stock.currency). Null
          when: both sides of the coalesce are missing for this ticker.
      - name: business_summary
        description: >
          Company description from Yahoo longBusinessSummary; nullable context for card UI.
      - name: company_founded_year
        description: >
          Company founding year from Yahoo when available; prefixes plain summary on the
          card. Null when: Yahoo does not report a founding year for this ticker.
      - name: forward_pe
        description: >
          Forward P/E ratio from info_forward_pe. Unit: multiple (x). Null when Yahoo omits forwardPE.
      - name: ebit_margin_pct
        description: >
          Operating margin percent: TTM from four quarterly operating-profit and revenue
          sums when complete; else latest annual operating profit / annual Total Revenue.
          Operating profit coalesces row-label fallbacks and Operating Revenue minus Expense.
          Null when: neither the four-quarter TTM inputs nor the annual-statement inputs
          are complete, or the revenue denominator on the available path (summed quarterly,
          or annual) is exactly zero.
      - name: ebit_margin_basis
        description: >
          Period basis for ebit_margin_pct -- ttm_quarterly or annual_latest. Null when:
          ebit_margin_pct itself is null (no basis to report).
      - name: revenue_growth_yoy_pct
        description: >
          YoY revenue growth as percent: info_revenue_growth × 100. Null when revenueGrowth missing.
      - name: info_ebitda
        description: >
          Raw EBITDA passthrough, alongside net_debt_to_ebitda below which is computed from it.
          Data-only -- not in the metric catalogue or the Supabase export. Lets
          scripts/assessment_rules.py's verdict banding detect when net_debt_to_ebitda's sign
          flipped because ebitda went negative (a leverage ratio that "explodes when EBITDA ~ 0",
          per this metric's own catalogue applicability note), not because net debt did.
      - name: net_debt_to_ebitda
        description: >
          Leverage ratio: coalesce(info_net_debt, info_total_debt - info_total_cash) / info_ebitda.
          Null when numerator or denominator missing or ebitda is zero.
      - name: stmt_free_cash_flow
        description: >
          Raw free cash flow passthrough, alongside fcf_margin_pct below which is computed from
          it. Data-only -- not in the metric catalogue or the Supabase export. Lets
          scripts/assessment_rules.py's current_ratio_stmt liquidity relief check free cash flow
          against the dollar size of the working-capital shortfall directly, rather than against
          fcf_margin_pct's revenue-scaled proxy, which doesn't track a liquidity gap that isn't
          proportional to revenue (e.g. a near-term debt-maturity wall).
      - name: fcf_margin_pct
        description: >
          FCF margin percent: stmt_free_cash_flow / stmt_total_revenue × 100. Null when revenue zero or fields missing.
      - name: roe_pct
        description: >
          Return on equity percent: info_return_on_equity × 100. Nullable; may be negative (loss-makers).
          Data-only: not in eligibility, the catalogue or the Supabase export.
      - name: current_ratio
        description: >
          Current assets / current liabilities (Yahoo currentRatio passthrough). Data-only -- not in
          eligibility, the metric catalogue, or the Supabase export yet. Null when: Yahoo
          does not report currentRatio for this ticker.
      - name: price_to_book
        description: >
          Price / book value per share (Yahoo priceToBook passthrough). Data-only -- not in eligibility,
          the metric catalogue, or the Supabase export yet. Null when: Yahoo does not report
          priceToBook for this ticker.
      - name: price_to_sales
        description: >
          Price / sales per share, trailing twelve months (Yahoo priceToSalesTrailing12Months passthrough).
          Data-only: not in eligibility, the catalogue or the Supabase export. Null when:
          Yahoo does not report this figure for this ticker.
      - name: ev_to_ebitda
        description: >
          Enterprise value / EBITDA (Yahoo enterpriseToEbitda passthrough). Data-only -- not in
          eligibility, the metric catalogue, or the Supabase export yet. Null when: Yahoo
          does not report enterpriseToEbitda for this ticker.
      - name: fcf_yield_pct
        description: >
          Free cash flow yield percent: info_free_cashflow / info_market_cap × 100 (Yahoo trailing
          freeCashflow over current marketCap; guarded against null/zero market cap). Nullable (null for
          financials with no freeCashflow); not clipped. Data-only -- not in eligibility, the metric
          catalogue, or the Supabase export yet.
      - name: stmt_stockholders_equity
        description: >
          Raw shareholders' equity passthrough, alongside debt_to_equity below which is computed
          from it. Data-only -- not in the metric catalogue or the Supabase export. Lets
          scripts/assessment_rules.py's verdict banding check equity's own sign directly, since
          stmt_total_debt can be exactly zero, and zero divided by negative equity is zero, not
          negative -- a debt-free company with negative equity would otherwise evade a check on
          the ratio's own sign.
      - name: debt_to_equity
        description: >
          Leverage: stmt_total_debt / stmt_stockholders_equity (statement-based; equity excludes
          minority interest). Guarded against null/zero equity. Operating-company solvency lens.
          Catalogued operating-card metric and exported; not in eligibility.
      - name: interest_coverage
        description: >
          Operating income (eff_stmt_op) / abs(stmt_interest_expense) -- abs() defends against the
          landed interest sign. Guarded against null/zero interest. Operating-company solvency lens.
          Data-only: not in eligibility, the catalogue or the Supabase export.
      - name: current_ratio_stmt
        description: >
          Statement current ratio: stmt_current_assets / stmt_current_liabilities. Guarded against
          null/zero liabilities; null for financials (no current split). Coexists with the info-scalar
          current_ratio. Catalogued operating-card metric and exported; not in eligibility.
      - name: working_capital
        description: >
          stmt_current_assets - stmt_current_liabilities (currency level). Null for financials.
          On the pre-revenue card (catalogued + exported); not part of eligibility.
      - name: price_to_tangible_book
        description: >
          Price-to-tangible-book: info_market_cap / stmt_tangible_book_value (both totals; guarded to
          tangible book > 0). Point-in-time market cap vs latest-annual tangible book. Financials
          valuation lens. Exported but no longer catalogued; not in eligibility. Null when:
          market cap or tangible book value is missing, or tangible book value is not
          positive.
      - name: net_margin_pct
        description: >
          Net margin percent: stmt_net_income / stmt_total_revenue * 100. Guarded against null/zero
          revenue. Catalogued financial-card metric, exported, and in financial eligibility.
      - name: roa_pct
        description: >
          Return on assets percent: stmt_net_income / stmt_total_assets * 100 (total net income over
          total assets -- leverage-neutral; the financials returns anchor). Guarded against null/zero
          assets. Catalogued financial-card metric and exported; not in eligibility.
      - name: statement_roe_pct
        description: >
          Statement ROE percent: stmt_net_income_common / stmt_stockholders_equity * 100 -- common
          income over common (parent-only) equity, both excluding minority interest (resolves the
          consolidated-NI-over-parent-equity mismatch). Guarded against null/zero equity. Coexists with
          the info-scalar roe_pct. Catalogued for operating and financial cards, exported, and in
          financial eligibility.
      - name: dividend_yield_pct
        description: >
          Dividend yield percent from info_dividend_yield. Yahoo returns this as a percent for most
          rows (0.94 = 0.94%) and as a fraction for a few (0.0387 = 3.87%, issue #10); a raw value
          below 0.05 is scaled by 100. On the data the rule was set on nothing genuine sat below 0.05%
          and no fraction row belonged to a 5%+ payer; either would break it.
          assert_dividend_yield_suspects counts those rows each run. Exported and stored, but no
          card renders it: not in eligibility and not in the metric catalogue. Null when:
          Yahoo does not report dividendYield for this ticker.
      - name: computed_fcf
        description: >
          Transparent free cash flow: stmt_operating_cash_flow + stmt_capital_expenditure (capex is
          negative). Distinct from the pre-packaged stmt_free_cash_flow / info_free_cashflow; the burn
          basis for cash_runway_months. Data-only -- not in eligibility, the metric catalogue, or the
          Supabase export yet. Null when: operating cash flow or capital expenditure is
          missing.
      - name: cash_runway_months
        description: >
          Months of cash at the current burn: stmt_cash_and_equivalents / (-computed_fcf) * 12, only
          when computed_fcf < 0 (burning) and stmt_cash_and_equivalents is present; null
          otherwise. Pre-revenue survival lens. On the pre-revenue
          card (catalogued + exported); not part of eligibility.
      - name: burn_rate_monthly
        description: >
          Monthly cash burn: -computed_fcf / 12, only when computed_fcf < 0; null otherwise (currency
          level). On the pre-revenue card (catalogued + exported); not part of eligibility.
      - name: net_cash_to_ev
        description: >
          Net cash relative to enterprise value: (stmt_cash_and_equivalents - stmt_total_debt) /
          (info_market_cap + stmt_total_debt - stmt_cash_and_equivalents). Guarded against zero EV.
          Data-only -- superseded on the pre-revenue card by net_cash (a money amount); not in the
          catalogue or export. Null when: market cap, total debt, or cash is missing, or the
          computed enterprise value is exactly zero.
      - name: net_cash_to_market_cap
        description: >
          Net cash relative to market cap: (stmt_cash_and_equivalents - stmt_total_debt) /
          info_market_cap. Guarded against zero market cap. Monotonic (no sign flip). Superseded
          by net_cash: this ratio divides by market cap, so it moves with the share price,
          which a twice-monthly pipeline cannot keep current. Still computed and exported; NO LONGER
          catalogued, so no card renders it, and no longer part of eligibility. Null when:
          market cap, cash, or total debt is missing, or market cap is exactly zero.
      - name: net_cash
        description: >
          Net cash as a money amount in the company's reporting currency:
          stmt_cash_and_equivalents - stmt_total_debt, null unless both are present. Pre-revenue-card
          cash metric and the pre_revenue eligibility key; catalogued + exported.
          Positive means more cash than borrowings. Two limits the user-facing copy also states:
          stmt_total_debt is borrowings and leases, not every obligation, and
          stmt_cash_and_equivalents is the narrow row excluding short-term investments, so a
          company holding its money in marketable securities reads lower than it really is.
      - name: company_type
        description: >
          Lifecycle/sector classification for the Sector Router: financial when
          coalesce(info_sector, dim_stock.sector) = 'Financial Services'; else pre_revenue when
          stmt_total_revenue is present and <= 0, OR when stmt_total_revenue is positive but under
          0.1% of info_market_cap (revenue negligible relative to valuation -- e.g. a development-stage
          miner/biotech that the strict <= 0 test alone misses); else operating. Always resolves to one
          of the three (non-null). A null stmt_total_revenue, or a positive-but-negligible revenue with
          no market cap to compare it against, is treated as a data gap (operating), not pre_revenue.
          Exported to the mart/Supabase (Sector Router) and drives per-type eligibility and card display.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["operating", "financial", "pre_revenue"]
      - name: is_card_eligible
        description: >
          True when the company_type's required metrics are present (operating: a four-metric AND;
          financial: statement_roe_pct + net_margin_pct; pre_revenue: net_cash). forward_pe was
          dropped from the operating and financial sets because a card must not be
          gated on a metric it no longer displays, which widens eligibility. False excludes the
          ticker from the discover pool. Never null in practice: every company_type branch of
          this CASE resolves to true or false; no `not_null` test is declared here yet.
      - name: missing_metrics
        description: >
          VARCHAR list of card metric column names that are null for this snapshot.
          Empty list when is_card_eligible is true. Internal QA only -- not exported to Supabase.

  - name: int_stock__sector_benchmarks
    description: >
      **What:** Sector median benchmarks for card metrics when enough eligible peers exist.
      **Grain:** One row per (market_code, sector).
      **Source:** int_stock__card_metrics (eligible rows only).
      **Used by:** mart_stock_cards.
    meta:
      owner: data
      domain: stock_cards
      criticality: medium
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - market_code
              - sector
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              (sector_peer_count >= 8)
              or (
                sector_median_forward_pe is null
                and sector_min_forward_pe is null
                and sector_max_forward_pe is null
                and sector_median_ebit_margin_pct is null
                and sector_min_ebit_margin_pct is null
                and sector_max_ebit_margin_pct is null
                and sector_q1_ebit_margin_pct is null
                and sector_q3_ebit_margin_pct is null
                and sector_median_revenue_growth_yoy_pct is null
                and sector_min_revenue_growth_yoy_pct is null
                and sector_max_revenue_growth_yoy_pct is null
                and sector_q1_revenue_growth_yoy_pct is null
                and sector_q3_revenue_growth_yoy_pct is null
                and sector_median_net_debt_to_ebitda is null
                and sector_min_net_debt_to_ebitda is null
                and sector_max_net_debt_to_ebitda is null
                and sector_q1_net_debt_to_ebitda is null
                and sector_q3_net_debt_to_ebitda is null
                and sector_median_fcf_margin_pct is null
                and sector_min_fcf_margin_pct is null
                and sector_max_fcf_margin_pct is null
                and sector_q1_fcf_margin_pct is null
                and sector_q3_fcf_margin_pct is null
                and sector_median_debt_to_equity is null
                and sector_min_debt_to_equity is null
                and sector_max_debt_to_equity is null
                and sector_q1_debt_to_equity is null
                and sector_q3_debt_to_equity is null
                and sector_median_current_ratio_stmt is null
                and sector_min_current_ratio_stmt is null
                and sector_max_current_ratio_stmt is null
                and sector_q1_current_ratio_stmt is null
                and sector_q3_current_ratio_stmt is null
                and sector_median_statement_roe_pct is null
                and sector_min_statement_roe_pct is null
                and sector_max_statement_roe_pct is null
                and sector_q1_statement_roe_pct is null
                and sector_q3_statement_roe_pct is null
                and sector_median_net_margin_pct is null
                and sector_min_net_margin_pct is null
                and sector_max_net_margin_pct is null
                and sector_q1_net_margin_pct is null
                and sector_q3_net_margin_pct is null
                and sector_median_roa_pct is null
                and sector_min_roa_pct is null
                and sector_max_roa_pct is null
                and sector_q1_roa_pct is null
                and sector_q3_roa_pct is null
              )
      - dbt_utils.expression_is_true:
          name: sector_benchmarks_min_le_median_le_max
          arguments:
            expression: >-
              (sector_min_forward_pe is null or sector_min_forward_pe <= sector_median_forward_pe)
              and (sector_max_forward_pe is null or sector_median_forward_pe <= sector_max_forward_pe)
              and (sector_min_ebit_margin_pct is null or sector_min_ebit_margin_pct <= coalesce(sector_q1_ebit_margin_pct, sector_median_ebit_margin_pct))
              and (sector_q1_ebit_margin_pct is null or sector_q1_ebit_margin_pct <= sector_median_ebit_margin_pct)
              and (sector_q3_ebit_margin_pct is null or sector_median_ebit_margin_pct <= sector_q3_ebit_margin_pct)
              and (sector_max_ebit_margin_pct is null or coalesce(sector_q3_ebit_margin_pct, sector_median_ebit_margin_pct) <= sector_max_ebit_margin_pct)
              and (sector_min_revenue_growth_yoy_pct is null or sector_min_revenue_growth_yoy_pct <= coalesce(sector_q1_revenue_growth_yoy_pct, sector_median_revenue_growth_yoy_pct))
              and (sector_q1_revenue_growth_yoy_pct is null or sector_q1_revenue_growth_yoy_pct <= sector_median_revenue_growth_yoy_pct)
              and (sector_q3_revenue_growth_yoy_pct is null or sector_median_revenue_growth_yoy_pct <= sector_q3_revenue_growth_yoy_pct)
              and (sector_max_revenue_growth_yoy_pct is null or coalesce(sector_q3_revenue_growth_yoy_pct, sector_median_revenue_growth_yoy_pct) <= sector_max_revenue_growth_yoy_pct)
              and (sector_min_net_debt_to_ebitda is null or sector_min_net_debt_to_ebitda <= coalesce(sector_q1_net_debt_to_ebitda, sector_median_net_debt_to_ebitda))
              and (sector_q1_net_debt_to_ebitda is null or sector_q1_net_debt_to_ebitda <= sector_median_net_debt_to_ebitda)
              and (sector_q3_net_debt_to_ebitda is null or sector_median_net_debt_to_ebitda <= sector_q3_net_debt_to_ebitda)
              and (sector_max_net_debt_to_ebitda is null or coalesce(sector_q3_net_debt_to_ebitda, sector_median_net_debt_to_ebitda) <= sector_max_net_debt_to_ebitda)
              and (sector_min_fcf_margin_pct is null or sector_min_fcf_margin_pct <= coalesce(sector_q1_fcf_margin_pct, sector_median_fcf_margin_pct))
              and (sector_q1_fcf_margin_pct is null or sector_q1_fcf_margin_pct <= sector_median_fcf_margin_pct)
              and (sector_q3_fcf_margin_pct is null or sector_median_fcf_margin_pct <= sector_q3_fcf_margin_pct)
              and (sector_max_fcf_margin_pct is null or coalesce(sector_q3_fcf_margin_pct, sector_median_fcf_margin_pct) <= sector_max_fcf_margin_pct)
              and (sector_min_debt_to_equity is null or sector_min_debt_to_equity <= coalesce(sector_q1_debt_to_equity, sector_median_debt_to_equity))
              and (sector_q1_debt_to_equity is null or sector_q1_debt_to_equity <= sector_median_debt_to_equity)
              and (sector_q3_debt_to_equity is null or sector_median_debt_to_equity <= sector_q3_debt_to_equity)
              and (sector_max_debt_to_equity is null or coalesce(sector_q3_debt_to_equity, sector_median_debt_to_equity) <= sector_max_debt_to_equity)
              and (sector_min_current_ratio_stmt is null or sector_min_current_ratio_stmt <= coalesce(sector_q1_current_ratio_stmt, sector_median_current_ratio_stmt))
              and (sector_q1_current_ratio_stmt is null or sector_q1_current_ratio_stmt <= sector_median_current_ratio_stmt)
              and (sector_q3_current_ratio_stmt is null or sector_median_current_ratio_stmt <= sector_q3_current_ratio_stmt)
              and (sector_max_current_ratio_stmt is null or coalesce(sector_q3_current_ratio_stmt, sector_median_current_ratio_stmt) <= sector_max_current_ratio_stmt)
              and (sector_min_statement_roe_pct is null or sector_min_statement_roe_pct <= coalesce(sector_q1_statement_roe_pct, sector_median_statement_roe_pct))
              and (sector_q1_statement_roe_pct is null or sector_q1_statement_roe_pct <= sector_median_statement_roe_pct)
              and (sector_q3_statement_roe_pct is null or sector_median_statement_roe_pct <= sector_q3_statement_roe_pct)
              and (sector_max_statement_roe_pct is null or coalesce(sector_q3_statement_roe_pct, sector_median_statement_roe_pct) <= sector_max_statement_roe_pct)
              and (sector_min_net_margin_pct is null or sector_min_net_margin_pct <= coalesce(sector_q1_net_margin_pct, sector_median_net_margin_pct))
              and (sector_q1_net_margin_pct is null or sector_q1_net_margin_pct <= sector_median_net_margin_pct)
              and (sector_q3_net_margin_pct is null or sector_median_net_margin_pct <= sector_q3_net_margin_pct)
              and (sector_max_net_margin_pct is null or coalesce(sector_q3_net_margin_pct, sector_median_net_margin_pct) <= sector_max_net_margin_pct)
              and (sector_min_roa_pct is null or sector_min_roa_pct <= coalesce(sector_q1_roa_pct, sector_median_roa_pct))
              and (sector_q1_roa_pct is null or sector_q1_roa_pct <= sector_median_roa_pct)
              and (sector_q3_roa_pct is null or sector_median_roa_pct <= sector_q3_roa_pct)
              and (sector_max_roa_pct is null or coalesce(sector_q3_roa_pct, sector_median_roa_pct) <= sector_max_roa_pct)
    columns:
      - name: market_code
        description: >
          Registry partition key for the peer set.
        data_tests:
          - not_null
      - name: sector
        description: >
          Sector label used to group eligible tickers for medians.
        data_tests:
          - not_null
      - name: sector_peer_count
        description: >
          Count of card-eligible tickers in this market and sector. Never null: a
          COUNT(*) aggregate, always populated for every (market_code, sector) group in
          this table.
      - name: sector_median_forward_pe
        description: >
          Median forward_pe among eligible peers. Null when fewer than 8 of the sector's
          eligible peers have a non-null forward_pe -- that per-metric count can fall short of
          sector_peer_count because forward_pe isn't required by either company_type's
          eligibility gate, and Yahoo frequently omits it.
      - name: sector_min_forward_pe
        description: >
          Minimum forward_pe among eligible peers (card range mark). No card renders this mark
          since forward_pe left the catalogue; the column is kept, unused. Null when fewer than
          8 of the sector's eligible peers have a non-null forward_pe -- that per-metric count
          can fall short of sector_peer_count because forward_pe isn't required by either
          company_type's eligibility gate, and Yahoo frequently omits it.
      - name: sector_max_forward_pe
        description: >
          Maximum forward_pe among eligible peers (card range mark). No card renders this mark
          since forward_pe left the catalogue; the column is kept, unused. Null when fewer than
          8 of the sector's eligible peers have a non-null forward_pe -- that per-metric count
          can fall short of sector_peer_count because forward_pe isn't required by either
          company_type's eligibility gate, and Yahoo frequently omits it.
      - name: sector_median_ebit_margin_pct
        description: >
          Median ebit_margin_pct among eligible peers. Null when fewer than 8 of the sector's
          eligible peers have a non-null ebit_margin_pct -- guaranteed for every peer in an
          operating-type sector (this metric gates operating eligibility), but not required in a
          financial-type sector, where the per-metric count can fall short of sector_peer_count.
      - name: sector_min_ebit_margin_pct
        description: >
          Minimum ebit_margin_pct among eligible peers (card range mark). Null when fewer than 8
          of the sector's eligible peers have a non-null ebit_margin_pct -- guaranteed for every
          peer in an operating-type sector (this metric gates operating eligibility), but not
          required in a financial-type sector, where the per-metric count can fall short of
          sector_peer_count.
      - name: sector_max_ebit_margin_pct
        description: >
          Maximum ebit_margin_pct among eligible peers (card range mark). Null when fewer than 8
