  - name: card_metrics_eligibility_no_longer_needs_forward_pe
    # The headline effect of the change, pinned. Before it, an operating or financial
    # company with a null forward_pe was INELIGIBLE and never reached a card; now it qualifies on
    # the remaining metrics alone. Nothing else in the suite covers this: the CI fixture set has
    # forward_pe populated on every row, so the eligibility change passed a green build without a
    # single row exercising the difference. OPNOPE is operating with no forward P/E, FINNOPE is a
    # bank with none; both must now be eligible. PRENOCAP is the pre-revenue half of the same
    # story -- no market cap at all, which used to make net_cash_to_market_cap null and the card
    # ineligible, and which net_cash does not need.
    model: int_stock__card_metrics
    given:
      - input: ref('fct_fundamentals_snapshot')
        rows:
          - {market_code: us_sp500, ticker: OPNOPE, snapshot_date: "2026-01-01", info_sector: Technology, stmt_total_revenue: 1000.0, info_forward_pe: null, info_revenue_growth: 0.1, info_net_debt: 200.0, info_ebitda: 400.0, stmt_operating_income: 250.0, stmt_free_cash_flow: 150.0}
          - {market_code: us_sp500, ticker: FINNOPE, snapshot_date: "2026-01-01", info_sector: "Financial Services", stmt_total_revenue: 1000.0, info_forward_pe: null, stmt_net_income: 200.0, stmt_net_income_common: 200.0, stmt_stockholders_equity: 1000.0}
          - {market_code: us_sp500, ticker: PRENOCAP, snapshot_date: "2026-01-01", info_sector: Healthcare, stmt_total_revenue: 0.0, stmt_cash_and_equivalents: 900.0, stmt_total_debt: 400.0}
      - input: ref('dim_stock')
        rows:
          - {market_code: us_sp500, ticker: OPNOPE, company_name: Op No PE, sector: Technology, currency: USD}
          - {market_code: us_sp500, ticker: FINNOPE, company_name: Fin No PE, sector: "Financial Services", currency: USD}
          - {market_code: us_sp500, ticker: PRENOCAP, company_name: Pre No Cap, sector: Healthcare, currency: USD}
    expect:
      rows:
        - {market_code: us_sp500, ticker: OPNOPE, company_type: operating, is_card_eligible: true, net_cash: null}
        - {market_code: us_sp500, ticker: FINNOPE, company_type: financial, is_card_eligible: true, net_cash: null}
        - {market_code: us_sp500, ticker: PRENOCAP, company_type: pre_revenue, is_card_eligible: true, net_cash: 500.0}
  - name: card_metrics_pre_revenue_eligibility_net_cash
    # Per-type eligibility (Router 4c): a pre_revenue company is eligible when net_cash is computable
    # (has cash + debt). PREOK has both -> eligible; PRENO lacks cash -> net_cash null -> ineligible.
    # Both classify pre_revenue (Healthcare, revenue 0).
    #
    # Changed with the switch from net_cash_to_market_cap to net_cash. PRENO used to be the
    # missing-MARKET-CAP case, because the old ratio divided by it. It no longer does, so a missing
    # market cap cannot make a pre-revenue card ineligible any more -- that is the intended effect of
    # taking the share price out, and it means MORE pre-revenue companies qualify than before.
    model: int_stock__card_metrics
    given:
      - input: ref('fct_fundamentals_snapshot')
        rows:
          - {market_code: us_sp500, ticker: PREOK, snapshot_date: "2026-01-01", info_sector: Healthcare, stmt_total_revenue: 0.0, info_market_cap: 5000.0, stmt_cash_and_equivalents: 2100.0, stmt_total_debt: 100.0}
          - {market_code: us_sp500, ticker: PRENO, snapshot_date: "2026-01-01", info_sector: Healthcare, stmt_total_revenue: 0.0, info_market_cap: 5000.0, stmt_total_debt: 100.0}
      - input: ref('dim_stock')
        rows:
          - {market_code: us_sp500, ticker: PREOK, company_name: Pre OK, sector: Healthcare, currency: USD}
          - {market_code: us_sp500, ticker: PRENO, company_name: Pre No, sector: Healthcare, currency: USD}
    expect:
      rows:
        - {market_code: us_sp500, ticker: PREOK, company_type: pre_revenue, is_card_eligible: true}
        - {market_code: us_sp500, ticker: PRENO, company_type: pre_revenue, is_card_eligible: false}
  - name: card_metrics_ratio_reclassified_pre_revenue_is_eligible
    # A company reclassified pre_revenue via the NEW ratio branch (revenue positive but < 0.1% of
    # market cap -- see card_metrics_company_type_classification for the classification pin alone)
    # must flip to the pre_revenue eligibility branch correctly too, exactly like a company that
    # classifies pre_revenue via the original revenue <= 0 branch above. DYL-like: revenue $1,000
    # against a $2,000,000 market cap (0.05%, under the floor), with cash/debt present so
    # net_cash is computable -- matches real DYL, which has cash and debt populated.
    model: int_stock__card_metrics
    given:
      - input: ref('fct_fundamentals_snapshot')
        rows:
          - {market_code: au_asx200, ticker: RATIOOK, snapshot_date: "2026-01-01", info_sector: Energy, stmt_total_revenue: 1000.0, info_market_cap: 2000000.0, stmt_cash_and_equivalents: 500000.0, stmt_total_debt: 100000.0}
      - input: ref('dim_stock')
        rows:
          - {market_code: au_asx200, ticker: RATIOOK, company_name: Ratio OK, sector: Energy, currency: AUD}
    expect:
      rows:
        - {market_code: au_asx200, ticker: RATIOOK, company_type: pre_revenue, is_card_eligible: true, missing_metrics: []}
