  - name: card_metrics_company_type_classification
    model: int_stock__card_metrics
    given:
      - input: ref('fct_fundamentals_snapshot')
        rows:
          - {market_code: us_sp500, ticker: FIN, snapshot_date: "2026-01-01", info_sector: Financial Services, stmt_total_revenue: 5000.0}
          - {market_code: us_sp500, ticker: FIN0, snapshot_date: "2026-01-01", info_sector: Financial Services, stmt_total_revenue: 0.0}
          - {market_code: us_sp500, ticker: PRE, snapshot_date: "2026-01-01", info_sector: Healthcare, stmt_total_revenue: 0.0}
          - {market_code: us_sp500, ticker: OPS, snapshot_date: "2026-01-01", info_sector: Technology, stmt_total_revenue: 200.0}
          - {market_code: us_sp500, ticker: NUL, snapshot_date: "2026-01-01", info_sector: Energy, stmt_total_revenue: null}
          # DYL-like: revenue positive but 0.05% of market cap -- under the 0.1% floor, reclassifies.
          - {market_code: au_asx200, ticker: MICRO, snapshot_date: "2026-01-01", info_sector: Energy, stmt_total_revenue: 1000.0, info_market_cap: 2000000.0}
          # Boundary: revenue 0.15% of market cap -- above the floor, stays operating. Pins both
          # sides of the threshold, not just the one case that motivated it.
          - {market_code: au_asx200, ticker: SMALL, snapshot_date: "2026-01-01", info_sector: Energy, stmt_total_revenue: 3000.0, info_market_cap: 2000000.0}
          # Positive-but-negligible revenue with NO market cap to compare it against -- a data gap,
          # not a signal, so this must stay operating rather than silently reclassifying on a
          # ratio it can't actually compute.
          - {market_code: au_asx200, ticker: NOMCAP, snapshot_date: "2026-01-01", info_sector: Energy, stmt_total_revenue: 1000.0}
      - input: ref('dim_stock')
        rows:
          - {market_code: us_sp500, ticker: FIN, company_name: Bank Co, sector: Financial Services, currency: USD}
          - {market_code: us_sp500, ticker: FIN0, company_name: Bank Zero Co, sector: Financial Services, currency: USD}
          - {market_code: us_sp500, ticker: PRE, company_name: Biotech Co, sector: Healthcare, currency: USD}
          - {market_code: us_sp500, ticker: OPS, company_name: Tech Co, sector: Technology, currency: USD}
          - {market_code: us_sp500, ticker: NUL, company_name: Energy Co, sector: Energy, currency: USD}
          - {market_code: au_asx200, ticker: MICRO, company_name: Micro Co, sector: Energy, currency: AUD}
          - {market_code: au_asx200, ticker: SMALL, company_name: Small Co, sector: Energy, currency: AUD}
          - {market_code: au_asx200, ticker: NOMCAP, company_name: No Mcap Co, sector: Energy, currency: AUD}
    expect:
      rows:
        - {market_code: us_sp500, ticker: FIN, company_type: financial}
        - {market_code: us_sp500, ticker: FIN0, company_type: financial}
        - {market_code: us_sp500, ticker: PRE, company_type: pre_revenue}
        - {market_code: us_sp500, ticker: OPS, company_type: operating}
        - {market_code: us_sp500, ticker: NUL, company_type: operating}
        - {market_code: au_asx200, ticker: MICRO, company_type: pre_revenue}
        - {market_code: au_asx200, ticker: SMALL, company_type: operating}
        - {market_code: au_asx200, ticker: NOMCAP, company_type: operating}
