  - name: card_metrics_annual_margin_when_quarterly_missing
    model: int_stock__card_metrics
    given:
      - input: ref('fct_fundamentals_snapshot')
        rows:
          - {
              market_code: uk_ftse100,
              ticker: HSBA,
              snapshot_date: "2026-01-01",
              info_forward_pe: 12.0,
              info_revenue_growth: 0.05,
              info_net_debt: 1000.0,
              info_ebitda: 500.0,
              info_sector: Financial Services,
              info_currency: GBP,
              stmt_total_revenue: 1000.0,
              stmt_free_cash_flow: 100.0,
              stmt_operating_income: 200.0,
              qtr_operating_income_0: null,
              qtr_operating_income_1: null,
              qtr_operating_income_2: null,
              qtr_operating_income_3: null,
              qtr_total_revenue_0: null,
              qtr_total_revenue_1: null,
              qtr_total_revenue_2: null,
              qtr_total_revenue_3: null,
            }
      - input: ref('dim_stock')
        rows:
          - {
              market_code: uk_ftse100,
              ticker: HSBA,
              company_name: HSBC,
              sector: Financial Services,
              currency: GBP,
            }
    expect:
      # HSBA is financial; per-type eligibility (4b) judges it on the financial required pair
      # (statement_roe_pct + net_margin_pct). This fixture supplies only operating inputs
      # (it targets the annual ebit_margin fallback), so it lacks statement ROE and net margin and is
      # ineligible -- but ebit_margin still falls back to the annual figure correctly.
      rows:
        - {
            market_code: uk_ftse100,
            ticker: HSBA,
            is_card_eligible: false,
            ebit_margin_pct: 20.0,
            ebit_margin_basis: annual_latest,
          }
