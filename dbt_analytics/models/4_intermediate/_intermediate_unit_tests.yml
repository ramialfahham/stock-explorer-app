  - name: sector_benchmarks_excludes_negative_equity_peer_from_debt_to_equity_and_roe
    model: int_stock__sector_benchmarks
    given:
      - input: ref('int_stock__card_metrics')
        rows:
          # 7 clean peers with a REAL spread (not degenerate -- a repeated single value can't
          # distinguish "guard applied" from "guard removed" for quantile_cont's interpolated
          # Q1/Q3: analytics-engineer-reviewer's round-2 catch, hand-verified below) and ordinary
          # positive equity. debt_to_equity 1.0..7.0 step 1; statement_roe_pct 10.0..70.0 step 10,
          # same relative shape so both metrics hand-verify the same way. The 8th peer has
          # NEGATIVE stmt_stockholders_equity: its debt_to_equity (-100.0) and statement_roe_pct
          # (-1000.0) are sign-flipped per assessment_rules.py's own documented failure mode, and
          # must be excluded from ALL FIVE of these 2 metrics' statistics, not just min -- an
          # extreme low value like this would otherwise become the new sector_min AND pull every
          # other statistic (median, Q1, Q3) toward it too.
          #
          # Hand-computed via DuckDB's linear-interpolation formula (h = (n-1)*p), same method
          # already used elsewhere in this file, not derived from the SQL under test:
          # WITH the guard (n=7, contaminated peer excluded): sorted [1,2,3,4,5,6,7].
          #   min=1.0, max=7.0, median: h=6*0.5=3 -> idx3=4.0 (exact).
          #   Q1: h=6*0.25=1.5 -> idx1+0.5*(idx2-idx1) = 2+0.5*(3-2) = 2.5.
          #   Q3: h=6*0.75=4.5 -> idx4+0.5*(idx5-idx4) = 5+0.5*(6-5) = 5.5.
          #   statement_roe_pct is the same shape x10: min=10.0, median=40.0, Q1=25.0, Q3=55.0,
          #   max=70.0.
          # WITHOUT the guard (n=8, contaminated peer included): sorted [-100,1,2,3,4,5,6,7].
          #   min=-100.0 (0-indexed idx0), median: h=7*0.5=3.5 -> idx3+0.5*(idx4-idx3) =
          #   3+0.5*(4-3) = 3.5. Q1: h=7*0.25=1.75 -> idx1+0.75*(idx2-idx1) = 1+0.75*(2-1) = 1.75.
          #   Q3: h=7*0.75=5.25 -> idx5+0.25*(idx6-idx5) = 5+0.25*(6-5) = 5.25.
          # Every statistic but max differs between the two (max is unaffected either way since
          # the contaminant is an extreme LOW value, never the max) -- so this fixture actually
          # discriminates "guard applied" from "guard removed" on min, median, Q1, and Q3 alike,
          # unlike the all-equal-clean-peer fixture this test used before.
          - {market_code: us_sp500, ticker: T1, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: 1.0, statement_roe_pct: 10.0, stmt_stockholders_equity: 40000.0}
