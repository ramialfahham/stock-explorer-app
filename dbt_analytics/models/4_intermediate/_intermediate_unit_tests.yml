              qtr_operating_expense_3: 5.0,
              qtr_total_revenue_0: 100.0,
              qtr_total_revenue_1: 100.0,
              qtr_total_revenue_2: 100.0,
              qtr_total_revenue_3: 100.0,
            }
      - input: ref('dim_stock')
        rows:
          - {
              market_code: uk_ftse100,
              ticker: LLOY,
              company_name: Lloyds,
              sector: Financial Services,
              currency: GBP,
            }
    expect:
      # This fixture targets the bank quarterly-op -> ebit_margin path, so it supplies only operating
      # inputs. Under per-type eligibility (4b) LLOY is financial and judged on the financial required pair
