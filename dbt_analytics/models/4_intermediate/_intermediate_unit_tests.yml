            market_code: us_sp500,
            sector: Technology,
            sector_peer_count: 8,
            sector_median_forward_pe: 13.5,
            sector_min_forward_pe: 10.0,
            sector_max_forward_pe: 17.0,
            sector_median_ebit_margin_pct: 20.0,
            # Every peer in this fixture reports the same ebit_margin_pct (20.0) -- the
            # degenerate min == median == max case the frontend range mark must handle
            # without dividing by zero (see test_benchmark_range_none_when_degenerate_min_equals_max).
            sector_min_ebit_margin_pct: 20.0,
            sector_max_ebit_margin_pct: 20.0,
          }
  - name: sector_benchmarks_computes_quartiles_with_real_spread
    model: int_stock__sector_benchmarks
    given:
      - input: ref('int_stock__card_metrics')
        rows:
          # ebit_margin_pct evenly spaced 10..24 (step 2) across 8 peers, sorted by construction --
          # Q1/Q3 hand-computed via linear interpolation (quantile_cont's own method, matching
          # median()'s): h = (n-1)*p with n=8. Q1: h=7*0.25=1.75 -> a[1]+0.75*(a[2]-a[1])
          # = 12+0.75*(14-12) = 13.5. Q3: h=7*0.75=5.25 -> a[5]+0.25*(a[6]-a[5])
          # = 20+0.25*(22-20) = 20.5. Not derived from the SQL under test -- computed by hand
          # against the standard linear-interpolation formula, per this doc's own anti-pattern
          # warning against self-referential fixtures (docs/ui/card_metric_cell.md).
          - {market_code: us_sp500, ticker: T1, sector: Industrials, is_card_eligible: true, company_type: operating, ebit_margin_pct: 10.0, revenue_growth_yoy_pct: 5.0, net_debt_to_ebitda: 1.0, fcf_margin_pct: 10.0}
