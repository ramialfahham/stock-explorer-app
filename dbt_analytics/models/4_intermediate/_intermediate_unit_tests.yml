      # ineligible -- but ebit_margin is still computed correctly from operating revenue - expense.
      rows:
        - {
            market_code: uk_ftse100,
            ticker: LLOY,
            is_card_eligible: false,
            ebit_margin_pct: 25.0,
            ebit_margin_basis: ttm_quarterly,
          }
