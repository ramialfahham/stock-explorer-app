          - {market_code: us_sp500, ticker: T3, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: 3.0, statement_roe_pct: 30.0, stmt_stockholders_equity: 40000.0}
          - {market_code: us_sp500, ticker: T4, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: 4.0, statement_roe_pct: 40.0, stmt_stockholders_equity: 40000.0}
          - {market_code: us_sp500, ticker: T5, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: 5.0, statement_roe_pct: 50.0, stmt_stockholders_equity: 40000.0}
          - {market_code: us_sp500, ticker: T6, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: 6.0, statement_roe_pct: 60.0, stmt_stockholders_equity: 40000.0}
          - {market_code: us_sp500, ticker: T7, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: 7.0, statement_roe_pct: 70.0, stmt_stockholders_equity: 40000.0}
          - {market_code: us_sp500, ticker: T8, sector: Industrials, is_card_eligible: true, company_type: operating, debt_to_equity: -100.0, statement_roe_pct: -1000.0, stmt_stockholders_equity: -5000.0}
    expect:
      rows:
        - {
            market_code: us_sp500,
            sector: Industrials,
            sector_peer_count: 8,
            sector_min_debt_to_equity: 1.0,
            sector_q1_debt_to_equity: 2.5,
            sector_median_debt_to_equity: 4.0,
            sector_q3_debt_to_equity: 5.5,
            sector_max_debt_to_equity: 7.0,
            sector_min_statement_roe_pct: 10.0,
