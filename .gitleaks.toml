# gitleaks config. Extends the built-in rules.
# To allow a repo-specific false positive, add an [[allowlists]] block with at least one
# check (commits / paths / regexes / stopwords) — gitleaks 8.x rejects an empty allowlist.
# Example:
#   [[allowlists]]
#     description = "dbt source() raw table names that trip the generic-api-key rule"
#     regexes = ['''source\(['"]my_source['"],\s*['"]raw_\w+['"]\)''']
[extend]
useDefault = true
