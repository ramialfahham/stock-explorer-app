name: Data Pipeline

on:
  schedule:
    # Weekly Monday 06:00 UTC — fundamentals refresh target
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      DBT_RAW_PATH: storage/raw
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply Supabase migrations
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SUPABASE_DB_PORT: ${{ secrets.SUPABASE_DB_PORT }}
        run: python scripts/apply_supabase_migrations.py

      - name: Run ingestion
        run: python scripts/run_ingestion.py

      - name: Create dbt profile
        shell: bash
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'EOF'
          dbt_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: storage/stock_data.db
                threads: 4
          EOF

      - name: dbt deps and build
        run: |
          dbt deps --project-dir dbt_analytics --profiles-dir "$HOME/.dbt"
          dbt build --project-dir dbt_analytics --profiles-dir "$HOME/.dbt"

      - name: Completeness gates
        run: python scripts/check_pipeline_completeness.py --duckdb-path storage/stock_data.db
        continue-on-error: false

      - name: Eligibility drop check
        run: python scripts/check_eligibility_baseline.py --duckdb-path storage/stock_data.db

      - name: Export health check
        run: python scripts/check_export_health.py --duckdb-path storage/stock_data.db

      - name: Export to Supabase
        run: python scripts/export_to_supabase.py --duckdb-path storage/stock_data.db

      - name: Generate assessments
        run: python scripts/generate_assessments.py --duckdb-path storage/stock_data.db
