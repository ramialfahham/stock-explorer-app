name: Data Pipeline

on:
  schedule:
    # Weekdays 06:00 UTC — adjust when ingestion is implemented
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

jobs:
  ingest-and-transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pipeline placeholder
        run: echo "Ingestion, dbt, and Supabase export not yet implemented."
