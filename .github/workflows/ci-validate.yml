name: ci-validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DBT_RAW_PATH: storage/raw
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Block protected-branch commits in CI checkout
        if: github.event_name == 'pull_request'
        run: python scripts/check_not_on_main.py

      - name: Enforce layer contract
        run: python scripts/check_layer_contract.py

      - name: Check registry/var sync
        run: python scripts/check_registry_var_sync.py

      - name: Enforce dbt SQL structure
        run: python scripts/check_dbt_sql_structure.py

      - name: Create dbt profile for CI
        shell: bash
        run: |
          mkdir -p /tmp/stock-swipe-raw
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'EOF'
          dbt_analytics:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: /tmp/stock_data_ci.db
                threads: 4
          EOF

      - name: Seed CI raw fixtures
        run: python scripts/seed_ci_raw_fixtures.py

      - name: dbt deps
        run: dbt deps --project-dir dbt_analytics --profiles-dir "$HOME/.dbt"

      - name: dbt parse
        run: dbt parse --project-dir dbt_analytics --profiles-dir "$HOME/.dbt"

      - name: Enforce dbt test policy
        run: python scripts/check_dbt_tests.py

      - name: Create repo profiles.yml for SQLFluff dbt templater
        run: cp profiles.yml.example profiles.yml

      - name: SQLFluff lint dbt SQL
        run: sqlfluff lint dbt_analytics/models dbt_analytics/tests

      - name: dbt build
        run: dbt build --project-dir dbt_analytics --profiles-dir "$HOME/.dbt"

      - name: Eligibility baseline check
        run: python scripts/check_eligibility_baseline.py --duckdb-path /tmp/stock_data_ci.db --baseline-path scripts/eligibility_baseline.ci.json

      - name: Eligibility gaps summary
        run: python scripts/check_eligibility_gaps.py --duckdb-path /tmp/stock_data_ci.db

      - name: dbt docs generate
        run: dbt docs generate --project-dir dbt_analytics --profiles-dir "$HOME/.dbt"

      - name: Enforce dbt documentation
        run: python scripts/check_dbt_documentation.py

      - name: Unit tests
        run: pip install pytest && python -m pytest tests/ -q

      - name: Metric audit script smoke (offline)
        run: python scripts/audit_mart_vs_yfinance.py --duckdb-path /tmp/stock_data_ci.db --offline --sample-size 5

  gate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        run: |
          if [ "${{ needs.validate.result }}" != "success" ]; then
            echo "validate did not pass (result=${{ needs.validate.result }})"
            exit 1
          fi
          echo "gate passed"
