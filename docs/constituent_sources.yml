# Constituent refresh sources (hybrid model).
# Ingestion reads committed seeds from storage/seeds/{market_code}/constituents.csv.
# Run scripts/refresh_constituents.py to update seeds from these sources.

schema_version: "1.0"

markets:
  us_sp500:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/List_of_S%26P_500_companies
    table_index: 0
    ticker_column: Symbol
    name_column: Security

  uk_ftse100:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/FTSE_100_Index
    table_index: 6
    ticker_column: Ticker
    name_column: Company

  au_asx200:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/S%26P/ASX_200
    table_index: 2
    ticker_column: Code
    name_column: Company

  jp_nikkei225:
    provider: manual
    refresh_enabled: false
    notes: >
      No stable public Wikipedia table. Update storage/seeds/jp_nikkei225/constituents.csv
      via scripts/import_constituents.py until an automated source is added.

  de_dax:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/DAX
    table_index: 4
    ticker_column: Ticker
    name_column: Company

  fr_cac40:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/CAC_40
    table_index: 4
    ticker_column: Ticker
    name_column: Company
    notes: >
      The Ticker column already carries its exchange suffix (AC.PA), and
      to_yfinance_ticker passes any ticker containing a dot through unchanged, so the
      registry's .PA suffix is not applied twice. That also keeps ArcelorMittal correct:
      it sits in the CAC 40 but lists in Amsterdam, and the table gives it as MT.AS.

  nl_aex:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/AEX_index
    table_index: 3
    ticker_column: Ticker
    name_column: Company
    notes: >
      25 constituents. FOUR of them are companies the deck already carries under uk_ftse100 or
      fr_cac40. ArcelorMittal (MT.AS) is in both this index and the CAC 40 on the same Amsterdam
      line, so the symbol-keyed collision guard flags it. Shell (SHELL.AS vs SHEL.L), Unilever
      (UNA.AS vs ULVR.L) and RELX (REN.AS vs REL.L) are single-share-class companies listed in
      both London and Amsterdam, so they resolve to different symbols and the symbol guard is
      blind to them; the company-name guard catches those. All four are real memberships, not
      copied seeds, and each ships a second card.

  ch_smi:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/Swiss_Market_Index
    table_index: 2
    ticker_column: Ticker
    name_column: Name
    notes: >
      The table gives BARE tickers (NOVN, not NOVN.SW), unlike the Dutch, Spanish and French
      tables, so frontend/live_quote.py's _EXCHANGE_SUFFIX is load-bearing here and inert there.
      The table carries a Rank column, so the company name is under Name rather than Company.
      That column also gives LEGAL names ("Novartis International AG") where every other source
      gives trade names ("Adidas", "Philips"), and the seed name wins over yfinance in dim_stock.
      Fixed 2026-08-28: nineteen ch_smi rows in dbt_analytics/seeds/company_name_overrides.csv
      correct this to trade names; the raw seed here is untouched by design.
      Switzerland TRADES in CHF, which has no _CURRENCY_SYMBOLS entry, so _display_currency
      returns the bare ISO code. Trades, not reports: audited 2026-08-28 against yfinance
      `financialCurrency`, NINE of the twenty file in something else. USD for Novartis, ABB, UBS,
      Zurich, Swiss Re, Alcon, Amrize and Logitech; EUR for Richemont. That includes the index's
      heaviest constituent and its three largest financials. The mart's currency is the display
      code and the read prompt says "trades in" for exactly this reason; anything that renders a
      franc on a money amount has to reckon with those nine. Not a Swiss novelty either:
      uk_ftse100 already carries Shell, BP, AstraZeneca, HSBC and Rio Tinto reporting in USD
      against a GBp trading currency. Recorded as observed
      behaviour: whether that is the wanted
      treatment is the owner's under section 6 and has not been decided.

  es_ibex35:
    provider: wikipedia
    url: https://en.wikipedia.org/wiki/IBEX_35
    table_index: 2
    ticker_column: Ticker
    name_column: Company
    notes: >
      This table produced the Wikipedia interlanguage marker that reached a card headline
      ("Laboratorios Rovi [es]", preceded by a non-breaking space). It is stripped at the writer
      now, in ingestion/constituents/seeds.py, and guarded in tests/ingestion. Also note MTS.MC,
      ArcelorMittal's Madrid line: the same company appears under fr_cac40 and nl_aex as MT.AS,
      and the SYMBOL-keyed collision guard cannot see
      this third listing, though the company-name guard does. Same for IAG: uk_ftse100 carries
      the bare ticker IAG, which resolves to IAG.L, and this seed carries IAG.MC. The raw strings
      differ, no seed holds IAG.L, and the symbol guard is blind because the RESOLVED symbols
      differ. Note IAG is not a stable identifier across seeds at all: au_asx200's IAG is
      Insurance Australia Group, an unrelated company.
