# Stock Swipe — Market Registry
# ==============================
# Single source of truth for which stock markets the app ingests and serves.
# Do not hardcode markets elsewhere. An entry here is the FIRST step of adding a market, not
# the whole of it: see the market activation checklist in docs/data_contract.md. A registry
# entry alone gives you a market that ingests nothing and whose next production export fails
# on a foreign key.
#
# Consumed by: ingestion (universe resolution), dbt (partition keys), CI (active set).
# After edits, run: python scripts/sync_dbt_vars.py
#
# ---------------------------------------------------------------------------
# Schema — required fields per market entry
# ---------------------------------------------------------------------------
#
# market_code       (string, required)
#   Stable snake_case identifier. Used in parquet paths, dbt vars, and Supabase keys.
#   Must be unique across all entries. Example: us_sp500
#
# index_name        (string, required)
#   Benchmark index ticker as understood by `source`. Used to resolve the
#   constituent universe for that market. Example: ^GSPC
#
# exchange_suffix   (string, required)
#   Suffix appended to local tickers when querying `source`. Include the leading
#   dot when the provider expects one (e.g. ".L" for London). Use "" when tickers
#   need no suffix (typical for US listings on yfinance).
#
# source            (string, required)
#   Data provider identifier. Currently supported: yfinance
#
# ingest_active     (boolean, required)
#   When true, the GitLab CI data-pipeline job includes this market. When false, the
#   entry remains configured but is skipped (useful for pausing a market without
#   deleting its definition).
#
# ---------------------------------------------------------------------------
# Optional extensions (not required today; add only when a consumer needs them)
# ---------------------------------------------------------------------------
# display_name, currency, timezone, constituent_source, notes
#
# ---------------------------------------------------------------------------

schema_version: "1.0"

markets:
  - market_code: us_sp500
    index_name: ^GSPC
    exchange_suffix: ""
    source: yfinance
    ingest_active: true

  - market_code: uk_ftse100
    index_name: ^FTSE
    exchange_suffix: .L
    source: yfinance
    ingest_active: true

  - market_code: jp_nikkei225
    index_name: ^N225
    exchange_suffix: .T
    source: yfinance
    ingest_active: true

  - market_code: au_asx200
    index_name: ^AXJO
    exchange_suffix: .AX
    source: yfinance
    ingest_active: true

  - market_code: de_dax
    index_name: ^GDAXI
    exchange_suffix: .DE
    source: yfinance
    ingest_active: true

  # European markets. Each one activates only after its own coverage audit and the full
  # activation checklist in data_contract.md, which includes a Supabase markets row: without
  # that row the export fails on a foreign key for every market, and no CI job catches it.
  - market_code: fr_cac40
    index_name: ^FCHI
    exchange_suffix: .PA
    source: yfinance
    ingest_active: true

  - market_code: nl_aex
    index_name: ^AEX
    exchange_suffix: .AS
    source: yfinance
    ingest_active: false

  - market_code: ch_smi
    index_name: ^SSMI
    exchange_suffix: .SW
    source: yfinance
    ingest_active: false

  - market_code: es_ibex35
    index_name: ^IBEX
    exchange_suffix: .MC
    source: yfinance
    ingest_active: false
