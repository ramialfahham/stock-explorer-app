<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <script>
      function sendMessageToStreamlitClient(type, data) {
        window.parent.postMessage({ type: type, ...data }, "*");
      }

      function init() {
        sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
      }

      function setFrameHeight(height) {
        sendMessageToStreamlitClient("streamlit:setFrameHeight", { height: height });
      }

      function sendDataToPython(data) {
        sendMessageToStreamlitClient("streamlit:setComponentValue", {
          value: data,
          dataType: "json",
        });
      }

      function onRender(event) {
        if (event.data.type !== "streamlit:render") return;

        const args = event.data.args || {};
        const key = args.storage_key;
        if (!key) {
          sendDataToPython("[]");
          setFrameHeight(0);
          return;
        }

        if (args.mode === "write") {
          localStorage.setItem(key, args.value || "[]");
          sendDataToPython("ok");
        } else {
          const value = localStorage.getItem(key) || args.default_value || "[]";
          sendDataToPython(value);
        }
        setFrameHeight(0);
      }

      window.addEventListener("message", onRender);
      init();
    </script>
  </body>
</html>
